# see-china 配置：《带你看中国 See China》英文系列（YouTube/Instagram 手动上传）
topics:
  - "The Great Wall: 2,000 Years of Wonder"
  - "High-Speed Rail: Crossing China at 350 km/h"
  - "Hotpot: China's Favorite Way to Dinner"
  - "Shanghai: The Skyline That Grew Overnight"
  - "Giant Pandas: China's National Treasure"
  - "Chinese Street Food Breakfast Tour"
  - "The Forbidden City: 9,999 Rooms of Mystery"
  - "Mobile Payment: A Cashless Day in China"
  - "Zhangjiajie: The Real Avatar Mountains"
  - "Spring Festival: The World's Largest Migration"
  - "Beijing Hutongs: Old Alleys, New Life"
  - "Guilin: Painted Landscapes Come True"
  - "The Terracotta Army: An Underground Empire"
  - "Night Markets: China After Dark"
  - "Tea Culture: A Cup of 1,000 Years"
  - "Suzhou: Venice of the East"
  - "Chinese High-Tech Life: Delivery in 30 Minutes"
  - "The Silk Road: Where East Met West"
  - "Harbin Ice Festival: A City of Crystal"
  - "West Lake: Poetry in a Landscape"
  - "Cantonese Dim Sum: The Art of Small Dishes"
  - "Tibet Railway: The Roof of the World"
  - "Chinese Calligraphy: Dancing Ink"
  - "Lantern Festival: Lighting Up the Sky"
  - "Chengdu: The Slowest Fast City"
  - "The Grand Canal: World's Longest River Road"
  - "Chinese Gardens: Landscapes of the Mind"
  - "Qingming: When China Remembers"
  - "Dragon Boat Festival: Racing the River"
  - "Mid-Autumn: The Festival of the Moon"

# 同一选题失败重试上限（超过后不再自动领取，需 redo <序号> 手动重置）
max_retries: 3

video:
  width: 1920          # 当前渲染管线按 1920x1080@30 硬编码，改这里会触发 precheck 警告
  height: 1080
  fps: 30
  sections_min: 10         # 段数（英文 55-95 词/段 → 每段 20-35 秒）
  sections_max: 14
  chars_per_section: [55, 95]   # 英文按词数计

# 讲稿结构校验失败的"修复重试"次数（仍不合法则整体失败，不带病进素材阶段）
script:
  max_fix_attempts: 2

transition:
  fade_seconds: 0.6        # 溶解时长
  tail_seconds: 0.6        # 旁白结束后、溶解开始前的画面停留
  end_hold_seconds: 2.0    # 片尾定格
  styles:                  # 转场轮换（旅行内容轻快些）
    - fade
    - dissolve
    - wipeleft
    - circleopen
    - fadeblack

narrator:
  backend: "edge"             # edge 恢复后自动用 Guy/Aria 神经音色
  voice: "en-US-GuyNeural"    # 美式男声（旅行host感）
  rate: "+3%"
  allow_sapi_fallback: false  # 默认关闭：SAPI 机械音不符合海外频道质量目标；
                              # 开启后若真的用了机械音，成片会被强制送人工审核
  # CosyVoice2 本地大模型批量合成（质量第一梯队；enable 时优先接管，
  # 失败自动降级 edge→Piper 本地神经音色；环境在 ../cosyvoice，与军史号共享）
  cosy:
    enable: true
    mode: "instruct2"
    prompt_wav: "repo/asset/cross_lingual_prompt.wav"
    instruct: "Speak as a warm, engaging English documentary narrator"
  # backend: "zhipu" 时生效（可选）：
  # zhipu:
  #   model: "cogtts"
  #   voice: "tongtong"

copywriter:
  model: "glm-4-flash"
  temperature: 0.8

# 内容审核（P1-4）：审核通道异常一律不放行；high 级问题进入人工裁决
review:
  model: "glm-4-flash"

bgm_volume: 0.20
bgm_dir: "../bili-history/bgm"   # 共享曲库显式路径；不存在/为空时 precheck 直接报错

hashtags: ["SeeChina", "ChinaTravel", "ChinaExplained"]

# 成片技术质检阈值（P1-6）—— 以下默认值待真实样片校准后调整，
# 只拦截"明显坏片"：音画错位、近无声、超长黑帧、字幕越界等
qc:
  duration_tolerance_s: 2.5
  max_silence_s: 8.0
  min_mean_volume_db: -45.0
  clip_threshold_db: -0.5
  max_black_start_s: 1.5
  max_black_ratio: 0.35
  min_cover_bytes: 2048
